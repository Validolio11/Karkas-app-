<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Завершення практики</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&amp;display=swap">
<style>
body{margin:0;background:#090a0a}
a{color:#6408fa}
button,input{font-family:inherit}
input::placeholder{color:#8e8e93}
@keyframes kUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kFade{from{opacity:0}to{opacity:1}}
@keyframes kDialog{from{opacity:0;transform:translateY(32px) scale(.96)}to{opacity:1;transform:none}}
div[aria-hidden="true"]{animation:kFade .5s ease backwards}
[role="dialog"]{animation:kDialog .55s cubic-bezier(.2,.8,.2,1) .1s backwards}
[role="dialog"] > *{animation:kUp .45s cubic-bezier(.2,.8,.2,1) backwards}
[role="dialog"] > *:nth-child(1){animation-delay:.25s}[role="dialog"] > *:nth-child(2){animation-delay:.32s}[role="dialog"] > *:nth-child(3){animation-delay:.39s}[role="dialog"] > *:nth-child(4){animation-delay:.46s}[role="dialog"] > *:nth-child(5){animation-delay:.53s}[role="dialog"] > *:nth-child(6){animation-delay:.6s}[role="dialog"] > *:nth-child(7){animation-delay:.67s}[role="dialog"] > *:nth-child(8){animation-delay:.74s}
[role="dialog"] span,[role="dialog"] [role="radio"]{transition:background-color .25s ease,color .25s ease}
[role="dialog"] button,[role="dialog"] a{transition:transform .15s ease,background-color .2s ease,color .2s ease}
[role="dialog"] button:hover,[role="dialog"] a:hover{transform:translateY(-1px)}[role="dialog"] button:active,[role="dialog"] a:active{transform:scale(.94)}
[aria-live="polite"]{transition:transform .2s ease}
html{scrollbar-width:thin;scrollbar-color:#3a3a3c transparent}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3a3c;border-radius:6px;border:3px solid #090a0a}::-webkit-scrollbar-thumb:hover{background:#13f287}::-webkit-scrollbar-corner{background:transparent}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="position: relative; min-height: 1000px; background: #090a0a; color: #090a0a; font-family: 'SF Pro Display', Inter, ui-sans-serif, system-ui, sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="height: 76px; display: flex; align-items: center; gap: 12px; padding: 0 24px"><div style="width: 44px; height: 44px; border-radius: 22px; background: #f4f4f2"></div></div>
<div style="width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 24px 32px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 120px; width: 50%; border-radius: 24px; background: #1f1f1f"></div>
<div style="height: 196px; border-radius: 48px; background: #13f287"></div>
<div style="height: 76px; border-radius: 38px; background: #f4f4f2"></div>
<div style="height: 96px; border-radius: 40px; background: #1f1f1f"></div>
<div style="height: 96px; border-radius: 40px; background: #1f1f1f"></div>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(9,10,10,0.78); backdrop-filter: blur(8px)"></div>

<div style="position: relative; min-height: 1000px; box-sizing: border-box; padding: 40px 16px; display: flex; align-items: center; justify-content: center">
<section role="dialog" aria-modal="true" aria-labelledby="practice-title" style="width: 100%; max-width: 600px; box-sizing: border-box; padding: 28px; border-radius: 48px; background: #f4f4f2; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 40px 100px rgba(0,0,0,0.6)">

<div style="display: flex; align-items: center; gap: 12px; padding: 0 0 4px 8px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600; color: #6e6e73">Холодні дзвінки · 24 хв</span>
<h1 id="practice-title" style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em">10 дзвінків з нової бази</h1>
</div>
<button type="button" aria-label="Закрити" style="flex-shrink: 0; width: 48px; height: 48px; border: none; border-radius: 24px; background: #090a0a; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 10px; box-sizing: border-box; padding: 12px 12px 12px 24px; border-radius: 36px; background: #ffffff">
<span style="font-size: 16px; font-weight: 600; color: #48484a">Зустрічей з 10</span>
<div style="display: flex; align-items: center; gap: 4px; margin-left: auto">
<button type="button" aria-label="Менше" onClick="{{dec}}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #e5e5e3; color: #090a0a; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span aria-live="polite" style="min-width: 44px; text-align: center; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">{{met}}</span>
<button type="button" aria-label="Більше" onClick="{{inc}}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #e5e5e3; color: #090a0a; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<span style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 24px; background: {{resBg}}; color: {{resInk}}; display: flex; flex-direction: column; justify-content: center; align-items: flex-end"><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">{{pct}}</span><span style="font-size: 11px; font-weight: 700; opacity: 0.8">{{cmp}}</span></span>
</div>

<div role="radiogroup" aria-label="Складність" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 30px; background: #ffffff">
<sc-for list="{{levels}}" as="lv" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{lv.checked}}" onClick="{{lv.pick}}" style="height: 48px; border: none; border-radius: 24px; background: {{lv.bg}}; color: {{lv.ink}}; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; cursor: pointer">{{lv.label}}</button>
</sc-for>
</div>

<label style="display: flex; align-items: center; gap: 10px; height: 64px; box-sizing: border-box; padding: 0 24px; border-radius: 32px; background: #ffffff">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Що змінюю наступного разу</span>
<input type="text" value="{{lesson}}" placeholder="Що змінюю наступного разу?" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #090a0a; font-size: 16px; font-weight: 600; padding: 0">
</label>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 4px; padding: 0 0 0 8px">
<button type="button" role="checkbox" aria-checked="{{countChecked}}" aria-labelledby="count-label" onClick="{{toggleCount}}" style="flex-shrink: 0; width: 32px; height: 32px; border: none; padding: 0; border-radius: 16px; background: {{countBox}}; box-shadow: inset 0 0 0 2px {{countRing}}; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{countTick}}"><path d="M20 6 9 17l-5-5"></path></svg></button>
<span id="count-label" style="flex: 1; min-width: 0; font-size: 15px; font-weight: 700">Контрольний замір</span>
<button type="button" style="height: 56px; border: none; border-radius: 28px; padding: 0 20px; background: transparent; color: #6e6e73; font-size: 15px; font-weight: 700; cursor: pointer">Пропустити</button>
<a href="Skill.dc.html" style="text-decoration: none; height: 56px; box-sizing: border-box; border-radius: 28px; padding: 0 30px; background: #090a0a; color: #ffffff; font-size: 16px; font-weight: 800; display: flex; align-items: center">Зберегти</a>
</div>

</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  componentDidMount() {
    var r = document.documentElement.style;
    r.colorScheme = 'dark'; r.background = '#090a0a';
    r.scrollbarWidth = 'thin'; r.scrollbarColor = '#3a3a3c #090a0a';
    try {
      var mt = +window.sessionStorage.getItem('karkas.measure');
      if (mt && Date.now() - mt < 60 * 1000) { this.setState({ counted: true }); window.sessionStorage.removeItem('karkas.measure'); }
    } catch (err) {}
  }
  constructor(props) {
    super(props);
    this.state = { met: 2, level: 'edge', counted: false, chip: 0 };
  }
  renderVals() {
    var self = this;
    var calls = 10, level = 17;
    var met = this.state.met;
    var p = Math.round(met / calls * 100);
    var above = p > level, same = p === level;
    var defs = [
      { id: 'easy', label: 'Легко', hint: 'На автоматі — це підтримка, а не ріст.' },
      { id: 'edge', label: 'На межі', hint: 'Помилявся й виправлявся — це і є зона росту.' },
      { id: 'hard', label: 'Занадто', hint: 'Не тримав фокус — наступного разу спростимо.' }
    ];
    var cur = defs.filter(function (d) { return d.id === self.state.level; })[0];
    var tips = [
      'Додам приклад окупності в одне речення',
      'Повторю так само ще раз',
      'Спрощу: по 2 заперечення за підхід'
    ];
    var counted = this.state.counted;
    return {
      met: met, pct: p + '%',
      cmp: above ? 'вище 17%' : (same ? 'як рівень' : 'нижче 17%'),
      resBg: above ? '#13f287' : '#3a3a3c', resInk: above ? '#090a0a' : '#ffffff',
      dec: function () { self.setState({ met: Math.max(0, self.state.met - 1) }); },
      inc: function () { self.setState({ met: Math.min(calls, self.state.met + 1) }); },
      levels: defs.map(function (d) {
        var on = self.state.level === d.id;
        return { label: d.label, checked: on ? 'true' : 'false',
          bg: on ? '#6408fa' : 'transparent', ink: on ? '#ffffff' : '#090a0a',
          pick: function () { self.setState({ level: d.id }); } };
      }),
      levelHint: cur.hint,
      lesson: tips[this.state.chip],
      chips: tips.map(function (t, i) {
        var on = self.state.chip === i;
        return { text: t, bg: on ? '#090a0a' : '#ffffff', ink: on ? '#ffffff' : '#090a0a',
          pick: function () { self.setState({ chip: i }); } };
      }),
      countChecked: counted ? 'true' : 'false',
      countBox: counted ? '#090a0a' : 'transparent',
      countRing: counted ? '#090a0a' : '#aeaeb2',
      countTick: counted ? '1' : '0',
      toggleCount: function () { self.setState({ counted: !self.state.counted }); }
    };
  }
}
</script>
</body>
</html>
