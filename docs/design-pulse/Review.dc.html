<span style="flex-shrink: 0; height: 28px; box-sizing: border-box; padding: 0 12px; border-radius: 14px; background: #6408fa; color: #ffffff; font-size: 12px; font-weight: 800; display: flex; align-items: center">{{p.skill}}</span>

</div>
<div style="position: relative; align-self: flex-start; max-width: 100%; box-sizing: border-box; margin-left: -14px; padding: 12px 16px; border-radius: 24px; background: {{c.noteBg}}; color: #ffffff; display: flex; align-items: center; gap: 10px">

</div>
</section>
</sc-for>
</div>
</div>
</div>
</main>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  componentDidMount() {
    var r = document.documentElement.style;
    r.colorScheme = 'dark'; r.background = '#090a0a';
    r.scrollbarWidth = 'thin'; r.scrollbarColor = '#3a3a3c #090a0a';
    this.onKey = function (e) {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.code === 'KeyN' || /^[nNтТ]$/.test(e.key))) {
        e.preventDefault();
        var a = document.querySelector('a[data-quick-add]');
        if (a) a.click();
      }
    };
    document.addEventListener('keydown', this.onKey, true);
    this.onAi = function (e) {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.code === 'KeyK' || /^[kKлЛ]$/.test(e.key))) {
        e.preventDefault();
        var a = document.querySelector('a[data-ai]');
        if (a) a.click();
      }
    };
    document.addEventListener('keydown', this.onAi, true);
  }
  componentWillUnmount() {
    document.removeEventListener('keydown', this.onKey, true);
    document.removeEventListener('keydown', this.onAi, true);
  }
  constructor(props) {
    super(props);
    this.state = { off: {} };
  }
  renderVals() {
    var self = this;

      { text: 'Контрольний замір, пт 15:00', skill: 'Дзвінки' }
    ];
    var plan = planItems.map(function (p, i) {
      var on = !self.state.off[i];
      return { text: p.text, skill: p.skill, checked: on ? 'true' : 'false',
        box: on ? '#090a0a' : 'transparent', ring: on ? '#090a0a' : '#c7c7cc', tick: on ? '1' : '0',
        toggle: function () { var off = Object.assign({}, self.state.off); off[i] = on; self.setState({ off: off }); } };
    });
    return {
      plan: plan,
      cards: [
        { name: 'Холодні дзвінки', status: 'Ріст', delta: '+1%', from: '16%', to: '17%', unit: 'конверсія',

          noteBg: '#090a0a', noteSub: '#13f287', whyLabel: 'Що спрацювало', why: 'Питання «з чим порівнюєте?» на запереченні «дорого».' },
        { name: 'React', status: 'Ріст', delta: '−0,2', from: '4,4', to: '4,2 год', unit: 'на фічу',
          bg: '#3a3a3c', ink: '#ffffff', sub: '#d1d1d6', hatch: '#8e8e93', hatchOp: '0.9', chipBg: '#13f287', chipInk: '#090a0a',
          noteBg: '#090a0a', noteSub: '#13f287', whyLabel: 'Що спрацювало', why: 'Фічу ділю на PR до 200 рядків — ревʼю вдвічі коротше.' },
        { name: 'Англійська', status: 'Плато 3 тиж', delta: '0', from: '68', to: '68', unit: 'слів/хв',
          bg: '#1f1f1f', ink: '#ffffff', sub: '#a1a1a6', hatch: '#ff4d4f', hatchOp: '0.9', chipBg: '#ff4d4f', chipInk: '#090a0a',
          noteBg: '#090a0a', noteSub: '#ff4d4f', whyLabel: 'Чому стоїть', why: '4 з 5 сесій — «легко». Знайомі теми не дають росту.' }
      ],
      wins: [
        { text: 'На «дорого» спершу питаю, з чим порівнюють', delta: '22 → 31%', what: 'заперечення «дорого»' },
        { text: 'Два конкретні слоти замість «коли зручно»', delta: '49 → 58%', what: 'закриття на зустріч' },
        { text: 'Фічу ділю на PR до 200 рядків', delta: '4,4 → 4,2 год', what: 'час на фічу' }
      ]
    };
  }
}
</script>
