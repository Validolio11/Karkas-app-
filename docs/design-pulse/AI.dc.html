<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&amp;display=swap">
<style>
body{margin:0;background:#090a0a}
a{color:#13f287}
button,input{font-family:inherit}
input::placeholder{color:#6e6e73}
@keyframes kUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes kPop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes kFade{from{opacity:0}to{opacity:1}}
@keyframes kIsland{0%{opacity:.9;transform:translateY(4px) scale(.3,.1);border-radius:300px}55%{opacity:1;border-radius:60px}100%{transform:none;border-radius:40px}}
@keyframes kPill{0%{opacity:0;transform:scale(1.6,4)}100%{opacity:1;transform:none}}
@keyframes kInner{from{opacity:0}to{opacity:1}}
@keyframes kGlow{0%{box-shadow:0 0 0 0 rgba(19,242,135,.55)}70%,100%{box-shadow:0 0 0 12px rgba(19,242,135,0)}}
@keyframes kDot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
@keyframes kWave{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes kRec{0%{box-shadow:0 0 0 0 rgba(19,242,135,.6),0 0 0 0 rgba(19,242,135,.3)}100%{box-shadow:0 0 0 14px rgba(19,242,135,0),0 0 0 28px rgba(19,242,135,0)}}
@keyframes kBlinkR{50%{opacity:.2}}
@keyframes kRecIn{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:none}}
.a-fade{animation:kFade .4s ease both}
.a-island{transform-origin:bottom center;animation:kIsland .6s cubic-bezier(.2,.9,.25,1) .1s both}
.a-island > *{animation:kInner .3s ease .45s both}
.a-pill{transform-origin:bottom center;animation:kPill .4s cubic-bezier(.2,.9,.25,1) both}
.a-pill:hover{transform:scale(1.05)}
.a-up{animation:kUp .5s cubic-bezier(.2,.8,.2,1) both}
.a-in{animation:kIn .45s cubic-bezier(.2,.8,.2,1) both}
.a-pop{animation:kPop .45s cubic-bezier(.2,.8,.2,1) both}
.a-avatar{animation:kPop .45s cubic-bezier(.2,.8,.2,1) .55s both,kGlow 2.4s ease-out 1.4s infinite}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:#a1a1a6;animation:kDot 1.2s ease-in-out infinite}
.wv{transform-origin:center;animation:kWave 1s ease-in-out infinite}
.rec-on{animation:kRec 1.4s ease-out infinite}
.rec-dot{animation:kBlinkR 1s ease-in-out infinite}
.rec-in{transform-origin:left center;animation:kRecIn .35s cubic-bezier(.2,.8,.2,1) both}
.press{transition:transform .15s ease}.press:hover{transform:scale(1.06)}.press:active{transform:scale(.94)}
.lift{transition:transform .2s ease}.lift:hover{transform:translateY(-2px)}
.feed{scrollbar-width:thin;scrollbar-color:#3a3a3c transparent}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</helmet>
