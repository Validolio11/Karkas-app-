<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&amp;display=swap">
<style>
body{margin:0;background:#090a0a}
a{color:#13f287}
button,input{font-family:inherit}
input::placeholder{color:#6e6e73}
@keyframes kUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes kSwap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main > *{animation:kUp .6s cubic-bezier(.2,.8,.2,1) backwards}
main > *:nth-child(2){animation-delay:.12s}
main > * > *{animation:kUp .55s cubic-bezier(.2,.8,.2,1) backwards}
main > * > *:nth-child(2){animation-delay:.08s}main > * > *:nth-child(3){animation-delay:.16s}main > * > *:nth-child(4){animation-delay:.24s}main > * > *:nth-child(5){animation-delay:.32s}main > * > *:nth-child(6){animation-delay:.4s}main > * > *:nth-child(7){animation-delay:.48s}
.swap{animation:kSwap .35s cubic-bezier(.2,.8,.2,1) both}
header button,header a{transition:transform .15s ease}header button:hover,header a:hover{transform:scale(1.06)}header button:active{transform:scale(.94)}
main button,main a{transition:transform .18s ease,background-color .2s ease,color .2s ease}main button:hover,main a:hover{transform:translateY(-2px)}main button:active,main a:active{transform:scale(.97)}
html{scrollbar-width:thin;scrollbar-color:#3a3a3c transparent}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
.wc button{transition:background-color .15s ease,color .15s ease}.wc button:hover{background:#3a3a3c;color:#ffffff}.wc button.x:hover{background:#ff4d4f;color:#ffffff}
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,-4px);white-space:nowrap;height:32px;line-height:32px;padding:0 12px;border-radius:16px;background:#f4f4f2;color:#090a0a;font-size:13px;font-weight:700;letter-spacing:0;opacity:0;pointer-events:none;transition:opacity .15s ease .35s,transform .15s ease .35s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}
[data-tip-up]::after{top:auto;bottom:calc(100% + 12px);transform:translate(-50%,4px)}
.pg > * > *{animation:kUp .55s cubic-bezier(.2,.8,.2,1) backwards}.pg > * > *:nth-child(2){animation-delay:.08s}.pg > * > *:nth-child(3){animation-delay:.16s}.pg > * > *:nth-child(4){animation-delay:.24s}.pg > * > *:nth-child(5){animation-delay:.32s}.pg > aside{animation-delay:.12s}
@media (max-width: 1040px){.pg{grid-template-columns:minmax(0,1fr) !important}}
@keyframes kMenu{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
[data-menu]{transform-origin:top left;animation:kMenu .18s cubic-bezier(.2,.8,.2,1) both}
[data-menu] button:hover{transform:none;background:#1f1f1f}
[data-editor] ::selection{background:#13f287;color:#090a0a}
.qc button:hover{transform:scale(1.08)}
.qt{animation:kSwap .3s cubic-bezier(.2,.8,.2,1) both}
[data-menu] [role="menuitem"]:hover{background:#1f1f1f !important}
@keyframes kMenuIn{0%{opacity:0;transform:translateY(-10px) scale(.94);filter:blur(4px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes kItem{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes kFold{from{opacity:0;transform:translateY(-6px) scaleY(.92)}to{opacity:1;transform:none}}
@keyframes kChipIn{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes kNum{0%{opacity:0;transform:translateX(-10px) scale(.7)}70%{opacity:1;transform:translateX(1px) scale(1.1)}100%{transform:none}}
@keyframes kToastIn{0%{opacity:0;transform:translateY(18px) scale(.9)}65%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{transform:none}}
@keyframes kShine{from{background-position:-120% 0}to{background-position:220% 0}}
[data-menu][role="menu"]{transform-origin:top left;animation:kMenuIn .32s cubic-bezier(.2,.9,.25,1.1) both}
[data-menu] [role="menuitem"]{animation:kItem .28s cubic-bezier(.2,.8,.2,1) backwards;transition:background-color .15s ease,color .15s ease}
[data-menu] [role="menuitem"]:nth-of-type(1){animation-delay:.04s}[data-menu] [role="menuitem"]:nth-of-type(2){animation-delay:.07s}[data-menu] [role="menuitem"]:nth-of-type(3){animation-delay:.1s}[data-menu] [role="menuitem"]:nth-of-type(4){animation-delay:.13s}[data-menu] [role="menuitem"]:nth-of-type(5){animation-delay:.16s}
[data-menu] [role="menuitem"] svg{transition:transform .2s cubic-bezier(.2,.8,.2,1)}[data-menu] [role="menuitem"]:hover svg{transform:translateX(2px) scale(1.12)}
[data-menu] [aria-pressed],[data-menu] [role="option"]{transition:background-color .2s ease,color .2s ease,transform .15s ease}
[data-menu] [aria-pressed]:active,[data-menu] [role="option"]:active,[data-menu] [aria-label="Менше"]:active,[data-menu] [aria-label="Більше"]:active{transform:scale(.9)}
[data-menu] [aria-live="polite"]{display:inline-block;transition:transform .2s ease}
.qf{transform-origin:top center;animation:kFold .22s cubic-bezier(.2,.8,.2,1) both;will-change:transform,opacity}
[data-menu][role="menu"]{will-change:transform,opacity}
html{scrollbar-gutter:stable}
.qf [role="option"]{animation:kItem .24s cubic-bezier(.2,.8,.2,1) backwards}
.qf [role="option"]:nth-child(2){animation-delay:.02s}.qf [role="option"]:nth-child(3){animation-delay:.04s}.qf [role="option"]:nth-child(4){animation-delay:.06s}.qf [role="option"]:nth-child(5){animation-delay:.08s}.qf [role="option"]:nth-child(6){animation-delay:.1s}
.qc{animation:kChipIn .42s cubic-bezier(.2,.9,.3,1.2) backwards;transition:background-color .25s ease,color .25s ease,transform .25s cubic-bezier(.2,.9,.3,1.3)!important}
.qc button{transition:transform .2s cubic-bezier(.2,.9,.3,1.3)}.qc button:active{transform:scale(.85)}
.qn{animation:kNum .4s cubic-bezier(.2,.9,.3,1.2) backwards}
[data-editor] [data-seg]{transition:font-size .28s cubic-bezier(.2,.8,.2,1),font-weight .28s ease,color .25s ease,letter-spacing .28s ease}
.qt{animation:kToastIn .45s cubic-bezier(.2,.9,.3,1.2) both !important}
@media (prefers-reduced-motion: reduce){.qt,.qc,.qn,.qf,[data-menu]{animation:none !important;transition:none !important}}
@keyframes kPage{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes kEdit{0%{opacity:0;transform:translateY(10px) scale(.98)}100%{opacity:1;transform:none}}
.qp{animation:kPage .32s cubic-bezier(.2,.8,.2,1) both}
.qe{animation:kEdit .3s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes kCaret{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
textarea[data-append]{animation:kCaret .25s ease both}
textarea[data-append]::placeholder{color:#c7c7cc}
[role="tablist"][aria-label="Сторінки"] button:active{transform:scale(.88)}
@media (prefers-reduced-motion: reduce){.qp,.qe{animation:none !important}}
@keyframes kPin{0%{opacity:0;transform:scale(.4) rotate(-40deg)}70%{opacity:1;transform:scale(1.15) rotate(8deg)}100%{transform:none}}
.qpin{animation:kPin .4s cubic-bezier(.2,.9,.3,1.2) backwards}
@media (prefers-reduced-motion: reduce){.qpin{animation:none !important}}
@keyframes kNewNote{0%{opacity:0;transform:translateY(-14px) scale(.96)}70%{opacity:1;transform:translateY(2px) scale(1.01)}100%{transform:none}}
input[data-title]::placeholder{color:#c7c7cc}
input[data-title]{animation:kCaret .25s ease both}
</style>
</helmet>

<main style="width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 24px 32px 120px; display: flex; flex-direction: column">
<div class="pg-head" style="display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px">
<div style="display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; text-transform: uppercase; letter-spacing: -0.035em; line-height: 0.92; font-size: 80px"><span style="display: block; font-weight: 300">Мій</span><span style="display: block; font-weight: 800">блокнот</span></h1>
<div role="group" aria-label="Фільтр" style="align-self: flex-start; display: flex; gap: 4px; padding: 4px; border-radius: 26px; background: #1f1f1f">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="height: 40px; border: none; border-radius: 20px; padding: 0 18px; background: {{f.bg}}; color: {{f.ink}}; font-size: 14px; font-weight: {{f.w}}; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
</div>
</div>
<div class="pg" style="display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 24px; align-items: start">
<aside class="pg-side" style="min-width: 0; display: flex; flex-direction: column; gap: 12px">
<label style="height: 60px; box-sizing: border-box; border-radius: 30px; background: #1f1f1f; padding: 0 8px 0 22px; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
<input type="text" aria-label="Пошук нотаток" placeholder="Пошук" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #ffffff; font-size: 16px; font-weight: 600; padding: 0">
<button type="button" aria-label="Нова нотатка" data-tip="Нова нотатка" onClick="{{newNote}}" style="cursor: pointer; width: 44px; height: 44px; border: none; border-radius: 22px; background: #f4f4f2; color: #090a0a; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</label>
<sc-for list="{{list}}" as="n" hint-placeholder-count="4">
<button type="button" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}" style="animation: {{n.anim}}; text-align: left; border: none; cursor: pointer; box-sizing: border-box; padding: 16px 20px; border-radius: 30px; background: {{n.bg}}; color: {{n.ink}}; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span><span style="font-size: 12px; font-weight: 600; color: {{n.sub}}">{{n.date}}</span></span>
<sc-if value="{{n.pinned}}" hint-placeholder-val="{{false}}"><span class="qpin" aria-label="Закріплено" style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 14px; background: #f4f4f2; color: #090a0a; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg></span></sc-if>
<span style="flex-shrink: 0; width: 10px; height: 10px; border-radius: 5px; background: {{n.dot}}"></span>
</button>
</sc-for>
</aside>
<div class="pg-main" style="min-width: 0; display: flex; flex-direction: column; gap: 12px">
<section aria-label="Нотатка" style="position: relative; min-width: 0; box-sizing: border-box; min-height: 760px; padding: 32px 36px; border-radius: 48px; background: #f4f4f2; color: #090a0a; display: flex; flex-direction: column; gap: 18px">
<div class="swap" key="{{cur.id}}" style="flex: 1; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<sc-if value="{{tagStatic}}" hint-placeholder-val="{{true}}"><span style="height: 30px; box-sizing: border-box; padding: 0 12px; border-radius: 15px; background: {{cur.tagBg}}; color: {{cur.tagInk}}; font-size: 12px; font-weight: 800; display: flex; align-items: center">{{cur.tag}}</span></sc-if>
<sc-if value="{{tagPick}}" hint-placeholder-val="{{false}}"><div role="radiogroup" aria-label="Тип нотатки" class="qe" style="display: flex; gap: 2px; padding: 3px; border-radius: 18px; background: #e5e5e3">
<sc-for list="{{kinds}}" as="kd" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{kd.on}}" onClick="{{kd.pick}}" style="height: 30px; border: none; border-radius: 15px; padding: 0 12px; background: {{kd.bg}}; color: {{kd.ink}}; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer; transition: background-color .2s ease, color .2s ease">{{kd.label}}</button>
</sc-for>
</div></sc-if>
<span style="font-size: 13px; font-weight: 600; color: #6e6e73">{{cur.date}}</span>
<span style="flex: 1"></span>
<button type="button" aria-label="Дописати" aria-pressed="{{editingOn}}" data-tip="Дописати" onClick="{{toggleEdit}}" style="width: 42px; height: 42px; border: none; border-radius: 21px; background: {{penBg}}; color: {{penInk}}; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color .25s ease, color .25s ease, transform .2s cubic-bezier(.2,.9,.3,1.3); transform: {{penRot}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5zM15 5l4 4"></path></svg></button>
</div>
<sc-if value="{{titleStatic}}" hint-placeholder-val="{{true}}"><h2 style="margin: 0; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em; color: {{titleInk}}">{{cur.title}}</h2></sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" data-title="1" aria-label="Назва нотатки" placeholder="Назва нотатки" style="display: block; width: 100%; box-sizing: border-box; margin: 0; padding: 0; border: none; outline: none; background: transparent; color: #090a0a; caret-color: #6408fa; font-family: inherit; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em"></sc-if>
<div data-editor="1" class="qp" key="{{pageKey}}" style="font-size: 18px; line-height: 1.7; font-weight: 400; color: #3a3a3c">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="5">
<sc-if value="{{g.isText}}" hint-placeholder-val="{{true}}"><span data-seg="{{g.i}}" style="{{g.css}}">{{g.v}}</span></sc-if>
