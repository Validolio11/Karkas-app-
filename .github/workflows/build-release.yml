name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Extract version from package.json
        id: pkg
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$ver" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Build Web Assets & Windows Installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify desktop services and packaged runtime
        shell: powershell
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFiles = Get-ChildItem electron, src/utils, server -Filter '*.test.*' -File
          node --import tsx --test $testFiles.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:KARKAS_TEST_APP_DIR = Join-Path $pwd 'release/win-unpacked/resources/app.asar'
          $smokeTest = Join-Path $pwd 'electron/server-runtime.test.cjs'
          $stdout = Join-Path $env:RUNNER_TEMP 'karkas-smoke-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'karkas-smoke-stderr.log'
          $process = Start-Process -FilePath 'release/win-unpacked/Karkas.exe' -ArgumentList "--test `"$smokeTest`"" -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout
          Get-Content $stderr
          exit $process.ExitCode

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Karkas-Setup-v${{ steps.pkg.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.pkg.outputs.version }}"
          name: "KARKAS v${{ steps.pkg.outputs.version }}"
          body: "Official release installer for KARKAS v${{ steps.pkg.outputs.version }}"
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
