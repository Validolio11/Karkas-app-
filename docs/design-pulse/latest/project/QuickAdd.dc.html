<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Швидке додавання</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&amp;display=swap">
<style>
body{margin:0;background:#090a0a}
button,input{font-family:inherit}
input::placeholder{color:#8e8e93}
@keyframes kDrop{from{opacity:0;transform:translateY(-18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes kFade{from{opacity:0}to{opacity:1}}
@keyframes kPop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes kUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.veil{animation:kFade .3s ease both}
.panel{animation:kDrop .45s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:kPop .3s cubic-bezier(.2,.8,.2,1) backwards}
.chip:nth-child(2){animation-delay:.04s}.chip:nth-child(3){animation-delay:.08s}
.row{animation:kUp .35s cubic-bezier(.2,.8,.2,1) backwards}
.panel button,.panel a{transition:transform .15s ease,background-color .2s ease}.panel button:hover{transform:translateY(-1px)}.panel button:active,.panel a:active{transform:scale(.96)}
html{scrollbar-width:thin;scrollbar-color:#3a3a3c transparent}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
.swap{animation:kUp .3s cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="position: relative; min-height: 1000px; background: #090a0a; color: #ffffff; font-family: 'SF Pro Display', Inter, ui-sans-serif, system-ui, sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; filter: blur(7px); opacity: 0.4; pointer-events: none">
<div style="height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #f4f4f2"></span>
<span style="display: flex; gap: 8px"><span style="width: 120px; height: 44px; border-radius: 22px; background: #f4f4f2"></span><span style="width: 80px; height: 44px; border-radius: 22px; background: #1f1f1f"></span><span style="width: 90px; height: 44px; border-radius: 22px; background: #1f1f1f"></span></span>
<span style="width: 300px; height: 44px; border-radius: 22px; background: #1f1f1f"></span>
</div>
<div style="max-width: 1280px; margin: 0 auto; padding: 24px 32px; display: flex; gap: 24px">
<div style="flex: 2; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 80px; line-height: 0.92; font-weight: 800; text-transform: uppercase; letter-spacing: -0.035em">Вівторок<br>20 жовтня</span>
<span style="height: 196px; border-radius: 48px; background: #13f287"></span>
<span style="height: 76px; border-radius: 38px; background: #f4f4f2"></span>
<span style="height: 92px; border-radius: 40px; background: #1f1f1f"></span>
<span style="height: 92px; border-radius: 40px; background: #1f1f1f"></span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 12px"><span style="height: 260px; border-radius: 44px; background: #6408fa"></span><span style="height: 380px; border-radius: 44px; background: #1f1f1f"></span></div>
</div>
</div>
<div class="veil" aria-hidden="true" style="position: absolute; inset: 0; background: rgba(9,10,10,0.55)"></div>

<section class="panel" role="dialog" aria-label="Швидке додавання задачі" style="position: relative; width: 780px; max-width: calc(100% - 32px); margin: 150px auto 0; box-sizing: border-box; padding: 14px; border-radius: 48px; background: #1f1f1f; box-shadow: 0 0 0 1px #2c2c2e, 0 40px 90px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 14px">

<label style="height: 84px; box-sizing: border-box; border-radius: 42px; background: #f4f4f2; color: #090a0a; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 14px">
<span style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 28px; background: #13f287; color: #090a0a; display: flex; align-items: center; justify-content: center"><svg width="22" height="23" viewBox="240 210 600 660" aria-hidden="true"><path d="{{k}}" fill="currentColor"></path></svg></span>
<input type="text" data-qa="1" autofocus aria-label="Нова задача" placeholder="Задача, дата, час, #категорія" value="Підготувати звіт для клієнта в пт о 15 #робота" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: #090a0a; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; padding: 0">
<button type="button" onClick="{{add}}" aria-label="Додати задачу" style="flex-shrink: 0; width: 60px; height: 60px; border: none; border-radius: 30px; background: #090a0a; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</label>

<sc-if value="{{hasQ}}" hint-placeholder-val="{{true}}">
<span style="padding: 4px 14px 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">{{title}}</span>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button type="button" aria-expanded="{{c.open}}" onClick="{{c.pick}}" style="height: 40px; border: none; border-radius: 20px; padding: 0 12px 0 14px; background: {{c.bg}}; color: {{c.ink}}; box-shadow: {{c.ring}}; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: background-color .2s ease, box-shadow .2s ease"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.label}}<span style="font-weight: 600; opacity: 0.6">{{c.note}}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: 0.6; transform: {{c.rot}}; transition: transform .2s ease"><path d="m6 9 6 6 6-6"></path></svg></button>
</sc-for>
</div>
<sc-if value="{{hasPicker}}" hint-placeholder-val="{{false}}">
<div class="swap" key="{{pickerLabel}}" role="listbox" aria-label="{{pickerLabel}}" data-drag="1" style="cursor: grab; user-select: none; -webkit-user-select: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 10px 4px; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl, 0px), #000 calc(100% - var(--fr, 48px)), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 var(--fl, 0px), #000 calc(100% - var(--fr, 48px)), transparent 100%)">
<sc-for list="{{picker}}" as="o" hint-placeholder-count="7">
<button type="button" role="option" aria-selected="{{o.sel}}" onClick="{{o.pick}}" style="flex-shrink: 0; min-width: {{o.w}}; height: {{o.h}}; border: none; border-radius: {{o.r}}; padding: 0 14px; background: {{o.bg}}; color: {{o.ink}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: inherit">
<sc-if value="{{o.top}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; opacity: 0.7">{{o.top}}</span></sc-if>
<span style="font-size: {{o.fs}}; font-weight: 800; letter-spacing: -0.02em; line-height: 1">{{o.main}}</span>
<sc-if value="{{o.bottom}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; opacity: 0.7">{{o.bottom}}</span></sc-if>
</button>
</sc-for>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 0 0">
<sc-for list="{{added}}" as="a" hint-placeholder-count="1">
<div class="row" style="display: flex; align-items: center; gap: 12px; height: 56px; box-sizing: border-box; padding: 0 20px 0 12px; border-radius: 28px; background: #090a0a">
<span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 16px; background: #13f287; color: #090a0a; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
<span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.title}}</span>
<span style="font-size: 13px; font-weight: 600; color: #8e8e93">{{a.meta}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 18px; padding: 6px 14px 4px; font-size: 13px; font-weight: 600; color: #8e8e93">
<span style="flex: 1"></span>
<a href="Today.dc.html" data-close="1" style="text-decoration: none; height: 56px; box-sizing: border-box; padding: 0 28px 0 22px; border-radius: 28px; background: #f4f4f2; color: #090a0a; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.35)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Готово</a>
</div>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      q: 'Підготувати звіт для клієнта в пт о 15 #робота',

  }
  componentDidMount() {

    };

      var d = self.drag;

      var dx = e.clientX - d.x;
      if (!d.moved && Math.abs(dx) > 4) {

    };

    document.addEventListener('pointerdown', this.onDown, true);

    document.addEventListener('click', this.onClickCap, true);

    document.removeEventListener('pointermove', this.onMove, true);
    document.removeEventListener('pointerup', this.onUp, true);
    document.removeEventListener('pointercancel', this.onUp, true);

    var cats = { 'робота': 'Робота', 'навчання': 'Навчання', 'дім': 'Дім', 'дом': 'Дім' };
    var base = new Date(2026, 9, 20);
    var tk = String(q || '').split(/\s+/).filter(Boolean);
    var used = tk.map(function () { return false; });
    var low = function (i) { return (tk[i] || '').toLowerCase().replace(/[,.!?]+$/, ''); };
    var off = null, time = null, cat = null, auto = false, m;
    for (var i = 0; i < tk.length; i++) {

    if (!cat) {
      var s = title.toLowerCase();

      else if (/вивч|прочита|курс|урок|англійськ|конспект/.test(s)) cat = 'Навчання';
      else if (/купи|прибра|оплат|продукт|ремонт|прати|готува/.test(s)) cat = 'Дім';
      auto = !!cat;
    }
    var label = null;
    if (off !== null) {
      var d = new Date(2026, 9, 20 + off);
      label = off === 0 ? 'Сьогодні' : off === 1 ? 'Завтра' : D[d.getDay()] + ', ' + d.getDate() + ' ' + M[d.getMonth()];
    }
    return { title: title, off: off, dateLabel: label, time: time, cat: cat, auto: auto };
  }
  labelOf(off) {
    var M = ['січ', 'лют', 'бер', 'квіт', 'трав', 'черв', 'лип', 'серп', 'вер', 'жовт', 'лист', 'груд'];

    var d = new Date(2026, 9, 20 + off);

  }
  effOf(p) {
    var st = this.state;
    var off = st.pDate !== null && st.pDate !== undefined ? st.pDate : p.off;

    return [
      mk('date', CAL, e.off !== null, e.off !== null ? e.dateLabel : 'Дата', '', '#13f287', '#090a0a'),
      mk('time', CLOCK, !!e.time, e.time || 'Час', '', '#f4f4f2', '#090a0a'),
      mk('cat', TAG, !!e.cat, e.cat || 'Категорія', e.auto ? 'авто' : '', '#6408fa', '#ffffff')

  pickerOf(e, base) {
    var self = this, open = this.state.open, items = [], i;
    var M = ['січ', 'лют', 'бер', 'квіт', 'трав', 'черв', 'лип', 'серп', 'вер', 'жовт', 'лист', 'груд'];

    var pick = function (patch) {
      return function () { patch.open = null; self.setState(patch); self.focusInput(); };

    var item = function (o, on, bg, ink) {

    if (open === 'date') {
      for (i = 0; i < 14; i++) {
        var d = new Date(2026, 9, 20 + i);
        items.push(item({ top: i === 0 ? 'сьогодні' : i === 1 ? 'завтра' : D[d.getDay()], main: String(d.getDate()),
          bottom: i === 0 || d.getDate() === 1 ? M[d.getMonth()] : '', w: '64px', h: '72px', r: '24px', fs: '22px',
          pick: pick({ pDate: i }) }, e.off === i, '#13f287', '#090a0a'));
      }

    }
    if (open === 'time') {
      for (i = 8; i <= 21; i++) {
        var t = ('0' + i).slice(-2) + ':00';
